name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11'
            constraint: '^11.0'
            testbench: '^9.0'
          - laravel: '12'
            constraint: '^12.0'
            testbench: '^10.0'
          - laravel: '13'
            constraint: '^13.0'
            testbench: '^11.0'
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Allow packages with known advisories
        # Laravel 11 is out of security support and every release of it has an advisory,
        # so Composer refuses to install it unless the advisory block is switched off.
        # The same goes for the oldest releases pulled in by prefer-lowest.
        if: matrix.laravel == '11' || matrix.stability == 'prefer-lowest'
        run: composer config policy.advisories.block false

      - name: Require Laravel ${{ matrix.laravel }}
        run: >
          composer require
          "laravel/framework:${{ matrix.constraint }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --dev --no-update --no-interaction

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|phpunit/phpunit|doctrine/dbal) '

      - name: Run tests
        run: composer run phpunit-ci

  static-analysis:
    name: Static analysis (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-static-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-static-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer run phpstan

      - name: Psalm
        run: composer run psalm

      - name: PHPMD
        run: vendor/bin/phpmd src text phpmd.xml

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
